baseURL = 'whoami.rezarajan.me/'
languageCode = 'en-us'
title = 'Reza Rajan - Curriculum Vitae'
theme = 'resume-a4'
disableKinds= ["taxonomy", "term", "section", "RSS", "sitemap", "robotsTXT", "404"]

# For GitHub Actions
[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Customizations
[params]
useFontAwesome = true
css = ["custom.scss"]

[params.header]
avatar = false
contact = true
tagline = true
links = true

[params.experience.tools]
show = false
title = "Technologies"

# Resume sections, rendered in order at /resume/
[[params.pages]]

[[params.pages.features]]
feature = "about"
title = "Summary"

[[params.pages.features]]
feature = "skills"
title = "Core Competencies"
widget = "word-list"
style = "compact"

[[params.pages.features]]
feature = "experience"
title = "Experience"

[[params.pages.features]]
feature = "education"
title = "Education"
widget = "education-inline"

[[params.pages.features]]
feature = "certificates"
title = "Certifications"
widget = "details-inline"
