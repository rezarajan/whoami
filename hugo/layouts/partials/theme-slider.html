<div class="theme-slider no-print" data-active="auto" role="radiogroup" aria-label="Color scheme">
	<button type="button" data-theme-value="auto" aria-label="Automatic color scheme" title="Auto"><i class="fas fa-adjust"></i></button>
	<button type="button" data-theme-value="light" aria-label="Light color scheme" title="Light"><i class="fas fa-sun"></i></button>
	<button type="button" data-theme-value="dark" aria-label="Dark color scheme" title="Dark"><i class="fas fa-moon"></i></button>
	<span class="thumb" aria-hidden="true"></span>
</div>
