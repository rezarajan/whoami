<script>
	// Auto/Light/Dark theme slider: applies the chosen scheme via a data-theme
	// attribute on <html> and persists it in localStorage. "Auto" defers to
	// the prefers-color-scheme media query.
	(function () {
		var order = ["auto", "light", "dark"];
		var slider = document.querySelector(".theme-slider");
		function current() {
			var t = localStorage.getItem("theme");
			return order.indexOf(t) >= 0 ? t : "auto";
		}
		function apply(t) {
			if (t === "auto") {
				delete document.documentElement.dataset.theme;
			} else {
				document.documentElement.dataset.theme = t;
			}
			if (slider) {
				slider.dataset.active = t;
				slider.querySelectorAll("[data-theme-value]").forEach(function (b) {
					b.classList.toggle("active", b.dataset.themeValue === t);
				});
			}
		}
		if (slider) {
			slider.querySelectorAll("[data-theme-value]").forEach(function (b) {
				b.addEventListener("click", function () {
					localStorage.setItem("theme", b.dataset.themeValue);
					apply(b.dataset.themeValue);
				});
			});
		}
		apply(current());
	})();

	// Keep the floating controls out of the reader's way: slide them off
	// while scrolling down, bring them back on scroll-up or near the top.
	(function () {
		var lastY = window.scrollY;
		var ticking = false;
		function onScroll() {
			if (ticking) return;
			ticking = true;
			requestAnimationFrame(function () {
				ticking = false;
				var y = window.scrollY;
				var delta = y - lastY;
				lastY = y;
				if (y < 60 || delta < -4) {
					delete document.documentElement.dataset.controlsHidden;
				} else if (delta > 4) {
					document.documentElement.dataset.controlsHidden = "";
				}
			});
		}
		window.addEventListener("scroll", onScroll, { passive: true });
	})();
</script>
